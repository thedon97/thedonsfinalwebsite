name: Apply optimized storefront patch
on:
  push:
    branches:
      - codex/storage-indexing-hardening-20260906
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated storefront changes
        shell: bash
        run: |
          echo '' | base64 -d | gunzip > /tmp/storefront.patch
          git apply --index --whitespace=nowarn /tmp/storefront.patch
          git rm .github/workflows/apply-storefront-patch.yml
          git config user.name 'The Don Jewelers Deployment'
          git config user.email 'thedonjewelersandjewelry@gmail.com'
          git commit -m 'Reduce deployment storage and repair indexing metadata'
          git push
