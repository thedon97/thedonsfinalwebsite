name: Apply storefront patch with three-way merge
on:
  push:
    branches:
      - codex/storage-indexing-hardening-20260906
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply validated storefront changes
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, pathlib, re
          source = pathlib.Path('.github/workflows/apply-storefront-patch.yml').read_text()
          payload = re.search(r"echo '([^']+)' \| base64 -d", source).group(1)
          pathlib.Path('/tmp/storefront.patch').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --3way --index --whitespace=nowarn /tmp/storefront.patch
          git rm .github/workflows/apply-storefront-patch.yml .github/workflows/apply-storefront-patch-3way.yml
          git config user.name 'The Don Jewelers Deployment'
          git config user.email 'thedonjewelersandjewelry@gmail.com'
          git commit -m 'Reduce deployment storage and repair indexing metadata'
          git push
